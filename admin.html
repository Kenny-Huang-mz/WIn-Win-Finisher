<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 - 代代共榮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#F58A42',
                        'brand-dark': '#1F2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 顶部导航栏 -->
        <header class="bg-gradient-to-r from-brand-orange to-orange-600 rounded-lg shadow-lg p-6 mb-8 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">🎯 管理員後台</h1>
                    <p class="mt-2 opacity-90">IG Finisher Program 管理系統</p>
                </div>
                <div class="text-right">
                    <p class="text-sm opacity-90">登入身份</p>
                    <p id="admin-name" class="font-bold">管理員</p>
                    <button onclick="logout()" class="mt-2 px-4 py-2 bg-white text-brand-orange rounded-lg hover:bg-gray-100 transition text-sm font-medium">
                        登出
                    </button>
                </div>
            </div>
        </header>

        <!-- 标签页导航 -->
        <div class="bg-white rounded-lg shadow-lg mb-6">
            <div class="flex border-b">
                <button onclick="switchAdminTab('activities')" id="tab-activities" class="admin-tab px-6 py-4 font-medium border-b-2 border-brand-orange text-brand-orange">
                    📋 所有活動記錄
                </button>
                <button onclick="switchAdminTab('users')" id="tab-users" class="admin-tab px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    👥 用戶進度
                </button>
                <button onclick="switchAdminTab('tasks')" id="tab-tasks" class="admin-tab px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    🧩 任務統計
                </button>
                <button onclick="switchAdminTab('files')" id="tab-files" class="admin-tab px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    📁 所有上傳文件
                </button>
                <button onclick="window.location.href='index.html'" class="ml-auto px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    🏠 返回主頁
                </button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div id="content-area">
            <!-- 所有活动记录 -->
            <div id="content-activities" class="tab-content">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">所有活動記錄</h2>
                        <button onclick="loadAllActivities()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">按用戶篩選（姓名/郵箱）</label>
                            <input type="text" id="activity-search" placeholder="例如：alice 或 alice@mail.com"
                                   oninput="filterActivities()"
                                   class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-brand-orange focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">按任務篩選（1-20）</label>
                            <select id="activity-task-filter" onchange="filterActivities()"
                                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-brand-orange focus:outline-none bg-white">
                                <option value="">全部任務</option>
                            </select>
                        </div>
                    </div>

                    <div id="activities-list" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">加載中...</p>
                    </div>
                </div>
            </div>

            <!-- 用戶進度 -->
            <div id="content-users" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">用戶任務完成進度</h2>
                        <button onclick="loadUserProgress()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    <div id="users-progress-list" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">加載中...</p>
                    </div>
                </div>
            </div>

            <!-- 任務統計 -->
            <div id="content-tasks" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">任務提交統計（1-20）</h2>
                        <button onclick="loadTaskOverview()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    <div id="tasks-overview-list" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">加載中...</p>
                    </div>
                </div>
            </div>

            <!-- 所有上传文件 -->
            <div id="content-files" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">所有上傳文件</h2>
                        <button onclick="loadAllFiles()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    
                    <!-- 搜索框 -->
                    <div class="mb-6">
                        <div class="relative">
                            <input type="text" 
                                   id="file-search" 
                                   placeholder="🔍 搜索用戶名或郵箱..." 
                                   oninput="filterFiles()"
                                   class="w-full px-4 py-3 pl-12 border-2 border-gray-300 rounded-lg focus:border-brand-orange focus:outline-none">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-xl">🔍</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">💡 提示：可以搜索用戶名或郵箱來過濾文件</p>
                    </div>
                    
                    <div id="files-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <p class="text-gray-500 text-center py-8 col-span-full">加載中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminUser = null;
        let activitiesData = [];
        let filesData = [];
        const TASK_COUNT = 20;

        function formatDateTime(dateString) {
            return new Date(dateString + 'Z').toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function initTaskFilterOptions() {
            const taskFilter = document.getElementById('activity-task-filter');
            if (!taskFilter) return;

            for (let i = 1; i <= TASK_COUNT; i++) {
                const option = document.createElement('option');
                option.value = String(i);
                option.textContent = `Task ${i}`;
                taskFilter.appendChild(option);
            }
        }

        // 页面加载时验证管理员身份
        window.addEventListener('DOMContentLoaded', () => {
            const userInfo = sessionStorage.getItem('userInfo');

            if (!userInfo) {
                alert('請先登入！');
                window.location.href = 'index.html';
                return;
            }

            adminUser = JSON.parse(userInfo);

            if (!adminUser.isAdmin) {
                alert('您沒有管理員權限！');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-name').textContent = `${adminUser.lastName}${adminUser.firstName}`;
            initTaskFilterOptions();
            loadAllActivities();
        });

        function clearClientAuthState() {
            try {
                sessionStorage.removeItem('userInfo');
                sessionStorage.removeItem('adminUser');
            } catch (error) {
                console.warn('清理 sessionStorage 失敗:', error);
            }

            try {
                localStorage.removeItem('userInfo');
                localStorage.removeItem('adminUser');
            } catch (error) {
                console.warn('清理 localStorage 失敗:', error);
            }
        }

        function logout() {
            if (!confirm('確定要登出嗎？')) return;
            clearClientAuthState();
            window.location.replace('index.html?_logout=' + Date.now());
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.admin-tab').forEach(el => {
                el.classList.remove('border-brand-orange', 'text-brand-orange');
                el.classList.add('text-gray-600');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.add('border-brand-orange', 'text-brand-orange');
            activeTab.classList.remove('text-gray-600');

            if (tabName === 'activities') loadAllActivities();
            else if (tabName === 'users') loadUserProgress();
            else if (tabName === 'tasks') loadTaskOverview();
            else if (tabName === 'files') loadAllFiles();
        }

        async function loadAllActivities() {
            const keyword = document.getElementById('activity-search').value.trim();
            const taskId = document.getElementById('activity-task-filter').value;
            const params = new URLSearchParams();
            if (keyword) params.set('keyword', keyword);
            if (taskId) params.set('taskId', taskId);

            try {
                const response = await fetch(`http://127.0.0.1:3000/api/admin/all-activities?${params.toString()}`);
                const data = await response.json();
                const listContainer = document.getElementById('activities-list');

                if (data.success && data.activities.length > 0) {
                    activitiesData = data.activities;
                    listContainer.innerHTML = data.activities.map((act, index) => `
                        <div class="border rounded-lg p-6 hover:shadow-md transition">
                            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-3 mb-4">
                                <div>
                                    <h3 class="text-lg font-bold text-brand-dark">${act.title}</h3>
                                    <p class="text-sm text-gray-500 mt-1">👤 ${act.last_name || ''}${act.first_name || ''} (${act.user_email})</p>
                                </div>
                                <div class="text-sm text-gray-500">
                                    <p>🧩 Task ${act.task_id || '-'}</p>
                                    <p>📅 ${formatDateTime(act.created_at)}</p>
                                </div>
                            </div>
                            <p class="text-gray-700 mb-4">${act.description}</p>
                            <div class="flex items-center gap-4 text-sm text-gray-600">
                                <span>📎 ${act.file_count} 個檔案</span>
                                <button onclick="viewActivityFiles(${index})" class="text-brand-orange hover:underline">查看檔案</button>
                            </div>
                            <div id="activity-files-${index}" class="hidden mt-4 grid grid-cols-2 md:grid-cols-3 gap-3"></div>
                        </div>
                    `).join('');
                } else {
                    activitiesData = [];
                    listContainer.innerHTML = '<p class="text-gray-500 text-center py-8">暫無符合條件的活動記錄</p>';
                }
            } catch (error) {
                console.error('加載活動失敗:', error);
                document.getElementById('activities-list').innerHTML = '<p class="text-red-500 text-center py-8">加載失敗</p>';
            }
        }

        function filterActivities() {
            loadAllActivities();
        }

        function viewActivityFiles(activityIndex) {
            if (!activitiesData[activityIndex]) {
                alert('無法獲取活動數據');
                return;
            }

            const activity = activitiesData[activityIndex];
            const filePaths = activity.file_paths || [];
            const container = document.getElementById(`activity-files-${activityIndex}`);

            if (!container) return;

            // 点击同一条记录时可展开/收起
            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                return;
            }

            if (filePaths.length === 0) {
                alert('該活動沒有上傳文件');
                return;
            }

            container.innerHTML = filePaths.map(filename => {
                const fileUrl = `http://127.0.0.1:3000/uploads/${encodeURIComponent(filename)}`;
                const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(filename);
                const isVideo = /\.(mp4|mov|avi|webm)$/i.test(filename);

                if (isImage) {
                    return `
                        <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="block border rounded-lg overflow-hidden bg-gray-50">
                            <img src="${fileUrl}" alt="${filename}" class="w-full h-40 object-cover">
                            <p class="text-xs text-gray-600 px-2 py-1 truncate">${filename}</p>
                        </a>
                    `;
                }

                if (isVideo) {
                    return `
                        <div class="border rounded-lg overflow-hidden bg-gray-50">
                            <video src="${fileUrl}" controls class="w-full h-40 object-cover bg-black"></video>
                            <p class="text-xs text-gray-600 px-2 py-1 truncate">${filename}</p>
                        </div>
                    `;
                }

                return `
                    <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="border rounded-lg p-3 bg-gray-50 hover:bg-gray-100">
                        <p class="text-2xl mb-2">📄</p>
                        <p class="text-xs text-gray-600 truncate">${filename}</p>
                    </a>
                `;
            }).join('');

            container.classList.remove('hidden');
        }

        function jumpToUserActivities(email) {
            document.getElementById('activity-search').value = email;
            document.getElementById('activity-task-filter').value = '';
            switchAdminTab('activities');
        }

        function jumpToTaskActivities(taskId) {
            document.getElementById('activity-search').value = '';
            document.getElementById('activity-task-filter').value = String(taskId);
            switchAdminTab('activities');
        }

        async function loadUserProgress() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/user-progress');
                const data = await response.json();
                const container = document.getElementById('users-progress-list');

                if (data.success && data.users.length > 0) {
                    container.innerHTML = data.users.map(user => {
                        const percent = Math.round((user.completedCount / TASK_COUNT) * 100);
                        const completedTasks = user.completedTasks.length > 0
                            ? user.completedTasks.map(t => `<span class="px-2 py-1 bg-orange-100 text-orange-700 rounded text-xs">T${t}</span>`).join(' ')
                            : '<span class="text-gray-400 text-sm">尚未提交</span>';

                        return `
                            <div class="border rounded-lg p-4">
                                <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3 mb-3">
                                    <div>
                                        <p class="font-bold text-brand-dark">${user.userName}</p>
                                        <p class="text-sm text-gray-500">${user.userEmail}</p>
                                    </div>
                                    <div class="text-sm text-gray-600">
                                        <p>完成度：${user.completedCount}/${TASK_COUNT} (${percent}%)</p>
                                        <p>最近提交：${user.lastSubmittedAt ? formatDateTime(user.lastSubmittedAt) : '—'}</p>
                                    </div>
                                </div>
                                <div class="w-full bg-gray-200 rounded h-2 mb-3">
                                    <div class="bg-brand-orange h-2 rounded" style="width: ${percent}%"></div>
                                </div>
                                <div class="flex flex-wrap gap-2 mb-3">${completedTasks}</div>
                                <button data-email="${user.userEmail}" onclick="jumpToUserActivities(this.dataset.email)" class="text-sm text-brand-orange hover:underline">
                                    查看該用戶提交 →
                                </button>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">暫無用戶進度數據</p>';
                }
            } catch (error) {
                console.error('加載用戶進度失敗:', error);
                document.getElementById('users-progress-list').innerHTML = '<p class="text-red-500 text-center py-8">加載失敗</p>';
            }
        }

        async function loadTaskOverview() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/task-overview');
                const data = await response.json();
                const container = document.getElementById('tasks-overview-list');

                if (data.success && data.tasks.length > 0) {
                    container.innerHTML = data.tasks.map(task => `
                        <div class="border rounded-lg p-4">
                            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-3">
                                <div>
                                    <p class="font-bold text-brand-dark">Task ${task.taskId}</p>
                                    <p class="text-sm text-gray-600 mt-1">${task.taskTitle}</p>
                                </div>
                                <div class="text-sm text-gray-600">
                                    <p>提交數：${task.submissionCount}</p>
                                    <p>參與人數：${task.userCount}</p>
                                    <p>最近提交：${task.lastSubmittedAt ? formatDateTime(task.lastSubmittedAt) : '—'}</p>
                                </div>
                            </div>
                            <button onclick="jumpToTaskActivities(${task.taskId})" class="mt-3 text-sm text-brand-orange hover:underline">
                                查看此任務所有提交 →
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">暫無任務統計數據</p>';
                }
            } catch (error) {
                console.error('加載任務統計失敗:', error);
                document.getElementById('tasks-overview-list').innerHTML = '<p class="text-red-500 text-center py-8">加載失敗</p>';
            }
        }

        async function loadAllFiles() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/all-files');
                const data = await response.json();
                const gridContainer = document.getElementById('files-grid');

                if (data.success && data.files.length > 0) {
                    filesData = data.files;
                    renderFiles(filesData);
                } else {
                    filesData = [];
                    gridContainer.innerHTML = '<p class="text-gray-500 text-center py-8 col-span-full">暫無上傳文件</p>';
                }
            } catch (error) {
                console.error('加載文件失敗:', error);
                document.getElementById('files-grid').innerHTML = '<p class="text-red-500 text-center py-8 col-span-full">加載失敗</p>';
            }
        }

        function renderFiles(sourceFiles) {
            const gridContainer = document.getElementById('files-grid');
            gridContainer.innerHTML = sourceFiles.map(file => {
                const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.filename);
                const isVideo = /\.(mp4|mov|avi|webm)$/i.test(file.filename);
                const fileSize = (file.size / 1024).toFixed(1);

                return `
                    <div class="border rounded-lg p-4 hover:shadow-lg transition cursor-pointer"
                         onclick="window.open('http://127.0.0.1:3000/uploads/${file.filename}', '_blank')">
                        ${isImage ? `
                            <img src="http://127.0.0.1:3000/uploads/${file.filename}" class="w-full h-48 object-cover rounded-lg mb-2" alt="${file.filename}">
                        ` : isVideo ? `
                            <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center"><span class="text-6xl">🎥</span></div>
                        ` : `
                            <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center"><span class="text-6xl">📄</span></div>
                        `}
                        <p class="text-xs text-gray-600 truncate mb-1" title="${file.filename}">${file.filename}</p>
                        <p class="text-xs text-gray-500">${fileSize} KB</p>
                        <div class="mt-2 pt-2 border-t">
                            <p class="text-xs text-gray-600 truncate" title="${file.userName}">👤 ${file.userName}</p>
                            <p class="text-xs text-gray-500 truncate" title="${file.userEmail}">📧 ${file.userEmail}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterFiles() {
            const searchTerm = document.getElementById('file-search').value.toLowerCase().trim();
            if (!filesData.length) return;

            const filteredFiles = filesData.filter(file => {
                const userName = (file.userName || '').toLowerCase();
                const userEmail = (file.userEmail || '').toLowerCase();
                return userName.includes(searchTerm) || userEmail.includes(searchTerm);
            });

            if (filteredFiles.length > 0) {
                renderFiles(filteredFiles);
            } else {
                document.getElementById('files-grid').innerHTML = '<p class="text-gray-500 text-center py-8 col-span-full">🔍 沒有找到匹配文件</p>';
            }
        }
    </script>
</body>
</html>
