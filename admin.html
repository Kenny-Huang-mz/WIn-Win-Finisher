<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 - 代代共榮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#F58A42',
                        'brand-dark': '#1F2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 顶部导航栏 -->
        <header class="bg-gradient-to-r from-brand-orange to-orange-600 rounded-lg shadow-lg p-6 mb-8 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">🎯 管理員後台</h1>
                    <p class="mt-2 opacity-90">IG Finisher Program 管理系統</p>
                </div>
                <div class="text-right">
                    <p class="text-sm opacity-90">登入身份</p>
                    <p id="admin-name" class="font-bold">管理員</p>
                    <button onclick="logout()" class="mt-2 px-4 py-2 bg-white text-brand-orange rounded-lg hover:bg-gray-100 transition text-sm font-medium">
                        登出
                    </button>
                </div>
            </div>
        </header>

        <!-- 标签页导航 -->
        <div class="bg-white rounded-lg shadow-lg mb-6">
            <div class="flex border-b">
                <button onclick="switchAdminTab('payments')" id="tab-payments" class="admin-tab px-6 py-4 font-medium border-b-2 border-brand-orange text-brand-orange">
                    ⏳ 待審核支付
                </button>
                <button onclick="switchAdminTab('activities')" id="tab-activities" class="admin-tab px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    📋 所有活動記錄
                </button>
                <button onclick="switchAdminTab('files')" id="tab-files" class="admin-tab px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    📁 所有上傳文件
                </button>
                <button onclick="window.location.href='index.html'" class="ml-auto px-6 py-4 font-medium text-gray-600 hover:text-brand-orange">
                    🏠 返回主頁
                </button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div id="content-area">
            <!-- 待审核支付 -->
            <div id="content-payments" class="tab-content">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">待審核支付憑證</h2>
                        <button onclick="loadPendingPayments()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    <div id="payments-list" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">加載中...</p>
                    </div>
                </div>
            </div>

            <!-- 所有活动记录 -->
            <div id="content-activities" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">所有活動記錄</h2>
                        <button onclick="loadAllActivities()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    
                    <!-- 搜索框 -->
                    <div class="mb-6">
                        <div class="relative">
                            <input type="text" 
                                   id="activity-search" 
                                   placeholder="🔍 搜索用戶名或郵箱..." 
                                   oninput="filterActivities()"
                                   class="w-full px-4 py-3 pl-12 border-2 border-gray-300 rounded-lg focus:border-brand-orange focus:outline-none">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-xl">🔍</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">💡 提示：可以搜索用戶名（例如：Carle）或完整郵箱地址</p>
                    </div>
                    
                    <div id="activities-list" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">加載中...</p>
                    </div>
                </div>
            </div>

            <!-- 所有上传文件 -->
            <div id="content-files" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-brand-dark">所有上傳文件</h2>
                        <button onclick="loadAllFiles()" class="px-4 py-2 bg-brand-orange text-white rounded-lg hover:bg-orange-600">
                            🔄 刷新
                        </button>
                    </div>
                    
                    <!-- 搜索框 -->
                    <div class="mb-6">
                        <div class="relative">
                            <input type="text" 
                                   id="file-search" 
                                   placeholder="🔍 搜索用戶名或郵箱..." 
                                   oninput="filterFiles()"
                                   class="w-full px-4 py-3 pl-12 border-2 border-gray-300 rounded-lg focus:border-brand-orange focus:outline-none">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-xl">🔍</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">💡 提示：可以搜索用戶名或郵箱來過濾該用戶上傳的所有文件</p>
                    </div>
                    
                    <div id="files-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <p class="text-gray-500 text-center py-8 col-span-full">加載中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminUser = null;

        // 页面加载时验证管理员身份
        window.addEventListener('DOMContentLoaded', () => {
            const userInfo = sessionStorage.getItem('userInfo');
            
            if (!userInfo) {
                alert('請先登入！');
                window.location.href = 'index.html';
                return;
            }

            adminUser = JSON.parse(userInfo);

            if (!adminUser.isAdmin) {
                alert('您沒有管理員權限！');
                window.location.href = 'index.html';
                return;
            }

            // 显示管理员名称
            document.getElementById('admin-name').textContent = `${adminUser.lastName}${adminUser.firstName}`;

            // 加载默认内容
            loadPendingPayments();
        });

        // 登出
        function logout() {
            if (confirm('確定要登出嗎？')) {
                sessionStorage.removeItem('userInfo');
                window.location.href = 'index.html';
            }
        }

        // 切换标签页
        function switchAdminTab(tabName) {
            // 隐藏所有内容
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // 重置所有标签样式
            document.querySelectorAll('.admin-tab').forEach(el => {
                el.classList.remove('border-brand-orange', 'text-brand-orange');
                el.classList.add('text-gray-600');
            });

            // 显示选中的内容
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            // 高亮选中的标签
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.add('border-brand-orange', 'text-brand-orange');
            activeTab.classList.remove('text-gray-600');

            // 加载对应数据
            if (tabName === 'payments') loadPendingPayments();
            else if (tabName === 'activities') loadAllActivities();
            else if (tabName === 'files') loadAllFiles();
        }

        // 加载待审核支付
        async function loadPendingPayments() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/pending-payments');
                const data = await response.json();

                const listContainer = document.getElementById('payments-list');

                if (data.success && data.payments.length > 0) {
                    listContainer.innerHTML = data.payments.map(payment => `
                        <div class="border rounded-lg p-6 hover:shadow-md transition">
                            <div class="flex flex-col md:flex-row gap-6">
                                <div class="flex-shrink-0">
                                    <img src="http://127.0.0.1:3000/uploads/${payment.payment_proof_path}" 
                                         alt="支付憑證" 
                                         class="w-64 h-64 object-cover rounded-lg border-2 cursor-pointer hover:opacity-80"
                                         onclick="window.open('http://127.0.0.1:3000/uploads/${payment.payment_proof_path}', '_blank')">
                                    <p class="text-xs text-gray-500 text-center mt-2">點擊查看大圖</p>
                                </div>
                                <div class="flex-1">
                                    <h3 class="text-xl font-bold text-brand-dark mb-4">
                                        ${payment.last_name || ''}${payment.first_name || ''} 的支付憑證
                                    </h3>
                                    <div class="space-y-2 mb-6">
                                        <p class="text-gray-700"><span class="font-medium">📧 郵箱：</span>${payment.user_email}</p>
                                        <p class="text-gray-700"><span class="font-medium">📅 提交時間：</span>${new Date(payment.submitted_at).toLocaleString('zh-TW')}</p>
                                    </div>
                                    <div class="mb-4">
                                        <label class="block text-sm font-medium mb-2">審核備註（可選）</label>
                                        <input type="text" id="notes-${payment.user_email}" placeholder="例如：付款金額正確" class="w-full px-4 py-2 border rounded-lg">
                                    </div>
                                    <div class="flex gap-4">
                                        <button onclick="reviewPayment('${payment.user_email}', 'approve')" class="flex-1 bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700">
                                            ✅ 批准
                                        </button>
                                        <button onclick="reviewPayment('${payment.user_email}', 'reject')" class="flex-1 bg-red-600 text-white py-3 px-6 rounded-lg hover:bg-red-700">
                                            ❌ 拒絕
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = '<p class="text-gray-500 text-center py-8">✅ 暫無待審核的支付憑證</p>';
                }
            } catch (error) {
                console.error('加載失敗:', error);
                document.getElementById('payments-list').innerHTML = '<p class="text-red-500 text-center py-8">加載失敗</p>';
            }
        }

        // 审核支付
        async function reviewPayment(userEmail, action) {
            const notesInput = document.getElementById(`notes-${userEmail}`);
            const notes = notesInput ? notesInput.value : '';

            if (!confirm(`確定要${action === 'approve' ? '批准' : '拒絕'} ${userEmail} 的支付憑證嗎？`)) return;

            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/review-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userEmail: userEmail,
                        action: action,
                        notes: notes,
                        adminEmail: adminUser.email
                    })
                });

                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadPendingPayments();
                } else {
                    alert(data.message || '操作失敗');
                }
            } catch (error) {
                console.error('審核失敗:', error);
                alert('審核失敗');
            }
        }

        // 加载所有活动记录
        async function loadAllActivities() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/all-activities');
                const data = await response.json();

                const listContainer = document.getElementById('activities-list');

                if (data.success && data.activities.length > 0) {
                    listContainer.innerHTML = data.activities.map((act, index) => `
                        <div class="border rounded-lg p-6 hover:shadow-md transition" id="activity-${index}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-brand-dark">${act.title}</h3>
                                    <p class="text-sm text-gray-500 mt-1">
                                        👤 ${act.last_name || ''}${act.first_name || ''} (${act.user_email})
                                    </p>
                                </div>
                                <span class="text-sm text-gray-500">
                                    📅 ${new Date(act.created_at + 'Z').toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })}
                                </span>
                            </div>
                            <p class="text-gray-700 mb-4">${act.description}</p>
                            <div class="flex items-center gap-4 text-sm text-gray-600">
                                <span>📎 ${act.file_count} 個檔案</span>
                                <button onclick="viewActivityFiles(${index})" class="text-brand-orange hover:underline">
                                    查看檔案 →
                                </button>
                            </div>
                        </div>
                    `).join('');
                    
                    // 保存活动数据以便查看文件
                    window.activitiesData = data.activities;
                } else {
                    listContainer.innerHTML = '<p class="text-gray-500 text-center py-8">暫無活動記錄</p>';
                }
            } catch (error) {
                console.error('加載失敗:', error);
                document.getElementById('activities-list').innerHTML = '<p class="text-red-500 text-center py-8">加載失敗</p>';
            }
        }

        // 查看活动文件
        function viewActivityFiles(activityIndex) {
            if (!window.activitiesData || !window.activitiesData[activityIndex]) {
                alert('無法獲取活動數據');
                return;
            }

            const activity = window.activitiesData[activityIndex];
            const filePaths = activity.file_paths;

            if (!filePaths || filePaths.length === 0) {
                alert('該活動沒有上傳文件');
                return;
            }

            const fileList = filePaths.map(f => `http://127.0.0.1:3000/uploads/${f}`).join('\n');
            
            if (confirm(`該活動共有 ${filePaths.length} 個文件。點擊確定在新窗口打開所有文件。\n\n${fileList}`)) {
                filePaths.forEach(f => window.open(`http://127.0.0.1:3000/uploads/${f}`, '_blank'));
            }
        }

        // 搜索过滤活动
        function filterActivities() {
            const searchInput = document.getElementById('activity-search');
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            if (!window.activitiesData) return;

            const listContainer = document.getElementById('activities-list');
            
            // 过滤活动数据
            const filteredActivities = window.activitiesData.filter(act => {
                const userName = `${act.last_name || ''}${act.first_name || ''}`.toLowerCase();
                const userEmail = (act.user_email || '').toLowerCase();
                
                return userName.includes(searchTerm) || userEmail.includes(searchTerm);
            });

            // 显示过滤后的结果
            if (filteredActivities.length > 0) {
                listContainer.innerHTML = filteredActivities.map((act, index) => {
                    // 找到原始索引
                    const originalIndex = window.activitiesData.indexOf(act);
                    
                    return `
                        <div class="border rounded-lg p-6 hover:shadow-md transition" id="activity-${originalIndex}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-brand-dark">${act.title}</h3>
                                    <p class="text-sm text-gray-500 mt-1">
                                        👤 ${act.last_name || ''}${act.first_name || ''} (${act.user_email})
                                    </p>
                                </div>
                                <span class="text-sm text-gray-500">
                                    📅 ${new Date(act.created_at + 'Z').toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })}
                                </span>
                            </div>
                            <p class="text-gray-700 mb-4">${act.description}</p>
                            <div class="flex items-center gap-4 text-sm text-gray-600">
                                <span>📎 ${act.file_count} 個檔案</span>
                                <button onclick="viewActivityFiles(${originalIndex})" class="text-brand-orange hover:underline">
                                    查看檔案 →
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                listContainer.innerHTML = `
                    <p class="text-gray-500 text-center py-8">
                        🔍 沒有找到匹配"${searchTerm}"的活動記錄
                    </p>
                `;
            }
        }

        // 加载所有文件
        async function loadAllFiles() {
            try {
                const response = await fetch('http://127.0.0.1:3000/api/admin/all-files');
                const data = await response.json();

                const gridContainer = document.getElementById('files-grid');

                if (data.success && data.files.length > 0) {
                    // 保存文件数据供搜索使用
                    window.filesData = data.files;
                    
                    gridContainer.innerHTML = data.files.map(file => {
                        const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.filename);
                        const isVideo = /\.(mp4|mov|avi|webm)$/i.test(file.filename);
                        const fileSize = (file.size / 1024).toFixed(1);
                        const fileType = file.isPaymentProof ? '💳 支付憑證' : '📁 活動文件';

                        return `
                            <div class="border rounded-lg p-4 hover:shadow-lg transition cursor-pointer" 
                                 onclick="window.open('http://127.0.0.1:3000/uploads/${file.filename}', '_blank')"
                                 data-username="${file.userName}"
                                 data-email="${file.userEmail}">
                                ${isImage ? `
                                    <img src="http://127.0.0.1:3000/uploads/${file.filename}" class="w-full h-48 object-cover rounded-lg mb-2" alt="${file.filename}">
                                ` : isVideo ? `
                                    <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center">
                                        <span class="text-6xl">🎥</span>
                                    </div>
                                ` : `
                                    <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center">
                                        <span class="text-6xl">📄</span>
                                    </div>
                                `}
                                <p class="text-xs text-gray-600 truncate mb-1" title="${file.filename}">${file.filename}</p>
                                <p class="text-xs text-gray-500">${fileSize} KB</p>
                                <div class="mt-2 pt-2 border-t">
                                    <p class="text-xs text-brand-orange font-medium">${fileType}</p>
                                    <p class="text-xs text-gray-600 truncate" title="${file.userName}">👤 ${file.userName}</p>
                                    <p class="text-xs text-gray-500 truncate" title="${file.userEmail}">📧 ${file.userEmail}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    gridContainer.innerHTML = '<p class="text-gray-500 text-center py-8 col-span-full">暫無上傳文件</p>';
                }
            } catch (error) {
                console.error('加載失敗:', error);
                document.getElementById('files-grid').innerHTML = '<p class="text-red-500 text-center py-8 col-span-full">加載失敗</p>';
            }
        }

        // 搜索过滤文件
        function filterFiles() {
            const searchInput = document.getElementById('file-search');
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            if (!window.filesData) return;

            const gridContainer = document.getElementById('files-grid');
            
            // 过滤文件数据
            const filteredFiles = window.filesData.filter(file => {
                const userName = (file.userName || '').toLowerCase();
                const userEmail = (file.userEmail || '').toLowerCase();
                
                return userName.includes(searchTerm) || userEmail.includes(searchTerm);
            });

            // 显示过滤后的结果
            if (filteredFiles.length > 0) {
                gridContainer.innerHTML = filteredFiles.map(file => {
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.filename);
                    const isVideo = /\.(mp4|mov|avi|webm)$/i.test(file.filename);
                    const fileSize = (file.size / 1024).toFixed(1);
                    const fileType = file.isPaymentProof ? '💳 支付憑證' : '📁 活動文件';

                    return `
                        <div class="border rounded-lg p-4 hover:shadow-lg transition cursor-pointer" 
                             onclick="window.open('http://127.0.0.1:3000/uploads/${file.filename}', '_blank')"
                             data-username="${file.userName}"
                             data-email="${file.userEmail}">
                            ${isImage ? `
                                <img src="http://127.0.0.1:3000/uploads/${file.filename}" class="w-full h-48 object-cover rounded-lg mb-2" alt="${file.filename}">
                            ` : isVideo ? `
                                <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center">
                                    <span class="text-6xl">🎥</span>
                                </div>
                            ` : `
                                <div class="w-full h-48 bg-gray-200 rounded-lg mb-2 flex items-center justify-center">
                                    <span class="text-6xl">📄</span>
                                </div>
                            `}
                            <p class="text-xs text-gray-600 truncate mb-1" title="${file.filename}">${file.filename}</p>
                            <p class="text-xs text-gray-500">${fileSize} KB</p>
                            <div class="mt-2 pt-2 border-t">
                                <p class="text-xs text-brand-orange font-medium">${fileType}</p>
                                <p class="text-xs text-gray-600 truncate" title="${file.userName}">👤 ${file.userName}</p>
                                <p class="text-xs text-gray-500 truncate" title="${file.userEmail}">📧 ${file.userEmail}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                gridContainer.innerHTML = `
                    <p class="text-gray-500 text-center py-8 col-span-full">
                        🔍 沒有找到匹配"${searchTerm}"的文件
                    </p>
                `;
            }
        }
    </script>
</body>
</html>
